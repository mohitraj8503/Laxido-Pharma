<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checkout | Laxido Pharma</title>
    <link rel="stylesheet" href="../css/checkout.css">
</head>
<body>

<main class="checkout-page">
    <header class="checkout-header">
        <span>LAXIDO PHARMA / SECURE CHECKOUT</span>
        <h1>Complete Your Order</h1>
        <p>Enter your delivery details to place your order.</p>
    </header>

    <div class="checkout-layout">
        <section class="checkout-form-section">
            <h2>Delivery Information</h2>

            <form id="checkoutForm">
                <label for="customerName">Full Name</label>
                <input type="text" id="customerName" required placeholder="Enter your full name">

                <label for="customerPhone">Phone Number</label>
                <input type="tel" id="customerPhone" pattern="[0-9]{10}" maxlength="10" required placeholder="10-digit mobile number">

                <label for="customerEmail">Email Address</label>
                <input type="email" id="customerEmail" required placeholder="Enter your email">

                <label for="customerAddress">Full Delivery Address</label>
                <textarea id="customerAddress" rows="4" required placeholder="House number, street, city, state and PIN code"></textarea>

                <button type="submit">Place Order</button>
                <p id="checkoutMessage" role="status"></p>
            </form>
        </section>

        <aside class="checkout-summary">
            <h2>Order Summary</h2>
            <div id="checkoutItems"></div>

            <div class="checkout-total-row">
                <span>Subtotal</span>
                <strong id="checkoutSubtotal">₹0</strong>
            </div>
            <div class="checkout-total-row">
                <span>Delivery</span>
                <strong>₹0</strong>
            </div>
            <div class="checkout-total-row grand-total">
                <span>Total</span>
                <strong id="checkoutTotal">₹0</strong>
            </div>

            <a href="cart.html">Back to Cart</a>
        </aside>
    </div>
</main>

<script src="../js/checkout.js"></script>
</body>
</html>
